[package]
name = "hyprshot"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lightweight screenshot and annotation tool for Hyprland"
repository = "https://github.com/misery8/hyprshot"
categories = ["gui", "command-line-utilities"]
keywords = ["screenshot", "hyprland", "wayland", "gtk"]
include = [
    "src/**/*",
    "resources/**/*",
    "build.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md"
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.31", features = ["poll"] }

cairo = { package = "cairo-rs", version = "0.21.5", features = ["png"] }
image = { version = "0.24", default-features = false, features = ["bmp", "png"] }

glib = "0.21"
gdk-pixbuf = "0.21"
gdk4 = "0.10.1"
gtk4 = "0.10.1"
gtk4-layer-shell = "0.7"
wayland-client = "0.31"

[build-dependencies]
glib-build-tools = "0.21.0"

[[bin]]
name = "clipboard"
path = "src/bin/clipboard-daemon.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
