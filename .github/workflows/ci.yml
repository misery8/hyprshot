name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            git \
            rust \
            cargo \
            gtk4 \
            gtk4-layer-shell \
            gdk-pixbuf2 \
            cairo \
            glib2 \
            wayland \
            pkgconf
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test --locked
      - name: Check release build
        run: cargo check --release --locked
