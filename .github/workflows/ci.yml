name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            git \
            rust \
            cargo \
            gtk4 \
            gtk4-layer-shell \
            gdk-pixbuf2 \
            cairo \
            glib2 \
            wayland \
            pkgconf \
            xorg-server-xvfb \
            xorg-xauth \
            imagemagick
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Run real GTK symbolic icon contract under Xvfb
        run: |
          HYPRSHOT_GTK_RENDER_TEST=1 xvfb-run -a -s "-screen 0 800x600x24" \
            cargo test --locked gtk_theme_resolves_toolbar_symbols_at_requested_size -- --test-threads=1 --nocapture
          echo 'GTK_SCREENSHOT_BASE64_BEGIN'
          base64 -w0 /tmp/hyprshot-toolbar-gtk-ci.png
          echo
          echo 'GTK_SCREENSHOT_BASE64_END'
      - name: Check release build
        run: cargo check --release --locked
      - name: Verify Arch package metadata
        run: |
          install -d -o nobody -g nobody -m 755 /tmp/hyprshot-pkgcheck
          install -m 644 PKGBUILD /tmp/hyprshot-pkgcheck/PKGBUILD
          runuser -u nobody -- sh -c 'cd /tmp/hyprshot-pkgcheck && makepkg --printsrcinfo' > /tmp/hyprshot.srcinfo
          diff -u .SRCINFO /tmp/hyprshot.srcinfo
